name: Hjemmeside (GitHub Pages)

# Bygger apps/web som statisk eksport (uden login – Pages kan ikke køre server-kode) og udgiver den på GitHub Pages.
# Kræver én gang: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/ui/**
      - packages/core/**
      - package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:

# Mindste rettigheder som udgangspunkt; kun deploy-jobbet får skriveadgang til Pages
permissions:
  contents: read

# Én udgivelse ad gangen; en igangværende udgivelse afbrydes ikke halvvejs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm run build:ui
      - name: Byg hjemmesiden (statisk eksport)
        run: npm run build:static -w web
        env:
          # "/re-spin" på imnotcap.github.io/re-spin – tom ved eget domæne
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # udgiv til Pages
      id-token: write   # bevis over for Pages, at udgivelsen kommer fra dette workflow (OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
