name: GitHub Pages (viderestilling til videro.dk)

# Siden er flyttet til videro.dk (Vercel). Den gamle testversion på imnotcap.github.io/re-spin er erstattet af en
# lille side, der sender alle adresser videre til samme sti på videro.dk, så gamle links stadig virker.
# Vil I lukke helt: Settings → Pages → Unpublish site (og slet så dette workflow).
on:
  push:
    branches: [main]
    paths:
      - .github/pages-redirect/**
      - .github/workflows/pages.yml
  workflow_dispatch:

# Mindste rettigheder som udgangspunkt; kun deploy-jobbet får skriveadgang til Pages
permissions:
  contents: read

# Én udgivelse ad gangen; en igangværende udgivelse afbrydes ikke halvvejs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .github/pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # udgiv til Pages
      id-token: write   # bevis over for Pages, at udgivelsen kommer fra dette workflow (OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
