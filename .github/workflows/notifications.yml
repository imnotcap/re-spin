# Mails om nye beskeder og svar fra kundeservice: kalder notifikationsjobbet på videro.dk hvert 5. minut.
# (Vercels gratisplan tillader kun cron én gang i døgnet – den daglige Vercel-cron er sikkerhedsnet.)
# Kræver repository-secret CRON_SECRET med SAMME værdi som i Vercel. Uden den springes kaldet over.
name: notifikationer

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: notifikationer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Kald notifikationsjobbet
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET mangler som repository-secret – springer over"
            exit 0
          fi
          curl -fsS --max-time 90 --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" -H "User-Agent: videro-notifikationer" \
            https://videro.dk/api/cron/notifikationer/
          echo
