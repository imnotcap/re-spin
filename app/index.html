<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdfbf7">
<title>re:spin – app-prototype</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/base.css">
<link rel="stylesheet" href="../design-system/components.css">
<style>
  /* Enhedsramme kun på desktop – på mobil fylder appen hele skærmen */
  body { background: #101512; }
  .stage { min-height: 100dvh; display: grid; place-items: center; }
  .device { position: relative; width: 100%; height: 100dvh; }
  .statusbar { display: none; } .statusbar span { color: #fff; mix-blend-mode: difference; }
  @media (min-width: 600px) {
    .stage { padding: 24px; background: radial-gradient(60% 60% at 70% 20%, #1b3a2a, #101512); }
    .device { width: 390px; height: 844px; max-height: calc(100dvh - 48px); border-radius: 54px; border: 10px solid #0b0b0b; box-shadow: 0 0 0 2px #333, var(--shadow-3), 0 40px 80px rgba(0,0,0,.5); overflow: hidden; --safe-top: 48px; --safe-bottom: 10px; }
    .device .app { height: 100%; }
    .statusbar { display: flex; position: absolute; z-index: 90; top: 0; left: 0; right: 0; height: 48px; padding: 14px 28px 0; justify-content: space-between; font-weight: 700; font-size: 15px; pointer-events: none; mix-blend-mode: normal; }
    .statusbar::before { content: ""; position: absolute; top: 11px; left: 50%; width: 110px; height: 30px; margin-left: -55px; border-radius: 20px; background: #000; }
  }
  /* embed-tilstand (bruges af overview.html) */
  html.embed .stage { padding: 0; background: none; display: block; }
  html.embed .device { width: 100%; height: 100dvh; max-height: none; border: 0; border-radius: 0; box-shadow: none; --safe-top: 48px; --safe-bottom: 10px; }
  html.embed .statusbar { display: flex; position: absolute; z-index: 90; top: 0; left: 0; right: 0; height: 48px; padding: 14px 28px 0; justify-content: space-between; font-weight: 700; font-size: 15px; pointer-events: none; }
  html.embed .statusbar::before { content: ""; position: absolute; top: 11px; left: 50%; width: 110px; height: 30px; margin-left: -55px; border-radius: 20px; background: #000; }
  html.embed .toast { display: none; }
  details.faq summary { list-style: none; cursor: pointer; } details.faq summary::-webkit-details-marker { display: none; }
  details.faq[open] summary svg { transform: rotate(180deg); } details.faq + details.faq { border-top: 1px solid var(--border); }
</style>
<script>if (/[?&]embed/.test(location.search)) document.documentElement.classList.add('embed');</script>
</head>
<body>
<div class="stage">
  <div class="device">
    <div class="statusbar" aria-hidden="true"><span>9:41</span><span>5G ▮▮▮</span></div>
    <main class="app" id="app"></main>
  </div>
</div>
<script src="../design-system/icons.js"></script>
<script src="../design-system/components.js"></script>
<script src="data.js"></script>
<script src="screens.js"></script>
<script src="app.js"></script>
</body>
</html>
