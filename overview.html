<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>re:spin – alle skærme</title>
<link rel="stylesheet" href="design-system/tokens.css"><link rel="stylesheet" href="design-system/base.css">
<style>
 body{background:#101512;color:var(--cream);padding:32px 24px 64px}
 h1{font-size:32px;font-weight:900;letter-spacing:-.03em} .sub{opacity:.7;margin:6px 0 32px;max-width:640px}
 h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--lime);margin:40px 0 16px}
 .row{display:flex;gap:28px;overflow-x:auto;padding-bottom:16px}
 figure{margin:0;flex:none;width:260px} figcaption{font-weight:700;margin-top:10px;font-size:14px} figcaption small{display:block;font-weight:400;opacity:.6;font-size:12px}
 .frame{width:260px;height:563px;border-radius:34px;overflow:hidden;border:6px solid #000;background:var(--cream);position:relative}
 iframe{width:390px;height:844px;border:0;transform:scale(.6564);transform-origin:0 0}
 a.nav{color:var(--lime);font-weight:700}
 nav.top{display:flex;gap:16px;margin-bottom:8px}
</style></head><body>
<h1>re:spin – alle skærme</h1>
<p class="sub">Skelet i mobil-format. Klik på en skærm for at åbne den i den klikbare prototype. Alle skærme er bygget af <a class="nav" href="design-system/index.html">designpakken</a>.</p>
<nav class="top"><a class="nav" href="app/index.html#/welcome">▶ Start prototype</a><a class="nav" href="design-system/index.html">Komponentbibliotek</a></nav>
<div id="out"></div>
<script>
const G=[
['Onboarding',[['welcome','Velkommen','Første indtryk, tre klar valg'],['login','Log ind','Social login + e-mail'],['signup','Opret konto','Trin 1 af 2'],['interests','Interesser','Trin 2 af 2 – personaliserer feed']]],
['Opdag',[['home','Hjem','Feed, kategorier, anbefalinger'],['search','Søg','Seneste, populært, forslag'],['results/ganni','Søgeresultater','Filtre + sortering'],['category/sneakers','Kategori','Samme liste, anden titel'],['favorites','Favoritter','Varer + sælgere']]],
['Vare & sælger',[['item/1','Vareside','Galleri, sælger, køb/byd'],['user/1','Sælgerprofil','Annoncer + anmeldelser']]],
['Sælg',[['sell','Opret annonce','Billeder, AI-baggrund, pris'],['sell/success','Annonce live','Bekræftelse + næste skridt']]],
['Beskeder',[['inbox','Indbakke','Samtaler pr. vare'],['chat/1','Chat','Hurtige svar'],['chat/3','Chat med bud','Bud-status'],['notifications','Notifikationer','']]],
['Køb & ordrer',[['checkout/2','Betaling','Adresse, fragt, betaling'],['order/success','Ordre bekræftet','Hvad sker der nu'],['orders','Mine ordrer','Køb / salg'],['order/101','Ordredetaljer','Tidslinje']]],
['Mig',[['profile','Min profil','Genveje + annoncer'],['profile/edit','Rediger profil',''],['wallet','Saldo','Udbetaling'],['settings','Indstillinger',''],['help','Hjælp','FAQ']]]];
document.getElementById('out').innerHTML=G.map(([t,l])=>`<h2>${t}</h2><div class="row">${l.map(([r,n,s])=>`<figure><a href="app/index.html#/${r}" class="frame" style="display:block"><iframe loading="lazy" src="app/index.html?embed#/${r}" title="${n}" tabindex="-1" style="pointer-events:none"></iframe></a><figcaption>${n}<small>${s}</small></figcaption></figure>`).join('')}</div>`).join('');
</script></body></html>
